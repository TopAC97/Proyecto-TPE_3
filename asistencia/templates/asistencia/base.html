{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Control de asistencia{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'asistencia/estilos.css' %}">
</head>

<body>

    <!-- Íconos reutilizables -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-escanear" viewBox="0 0 24 24">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <circle cx="12" cy="9.5" r="2.5"/><path d="M7.5 17c.7-2.2 2.4-3.5 4.5-3.5s3.8 1.3 4.5 3.5"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
        <symbol id="i-calendario" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>
            <path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/>
        </symbol>
        <symbol id="i-usuarios" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </symbol>
        <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></symbol>
        <symbol id="i-camara" viewBox="0 0 24 24">
            <circle cx="12" cy="10" r="8"/><circle cx="12" cy="10" r="3"/><path d="M7 22h10"/><path d="M12 22v-4"/>
        </symbol>
        <symbol id="i-lista" viewBox="0 0 24 24">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
        </symbol>
        <symbol id="i-historial" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
        </symbol>
        <symbol id="i-volver" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
        <symbol id="i-editar" viewBox="0 0 24 24">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </symbol>
        <symbol id="i-borrar" viewBox="0 0 24 24">
            <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </symbol>
        <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
        <symbol id="i-destello" viewBox="0 0 24 24">
            <path d="M5 4l3 5"/><path d="M13 9l6-4"/><path d="M12 15l7 1"/>
        </symbol>
    </svg>

    <header class="encabezado">
        <div class="contenedor encabezado-contenido">
            <div class="marca">
                <div class="logo">
                    <svg class="icono"><use href="#i-escanear"/></svg>
                    <span class="logo-check"><svg class="icono"><use href="#i-check"/></svg></span>
                </div>
                <div>
                    <h1>Control de asistencia</h1>
                    <p>Cada llegada cuenta</p>
                </div>
            </div>

            <div class="fecha">
                <svg class="icono"><use href="#i-calendario"/></svg>
                <span>{% now "j \d\e F \d\e Y" %}</span>
            </div>
        </div>

        <svg class="encabezado-deco" viewBox="0 0 300 130" aria-hidden="true">
            <path d="M40 120 C 10 80, 60 40, 130 60 S 240 40, 300 20" fill="none" stroke="#A99DE6" stroke-width="1.5"/>
            <path d="M120 125 C 170 90, 230 100, 300 70" fill="none" stroke="#A99DE6" stroke-width="1.5"/>
            <circle cx="70" cy="44" r="7" fill="#FDE7A3" stroke="#E9B949" stroke-width="1.5"/>
            <circle cx="146" cy="104" r="9" fill="#BBE7D0" stroke="#fff" stroke-width="2"/>
            <path d="M300 60 C 260 90, 250 130, 250 130 L 300 130 Z" fill="#D5F0E0" opacity="0.8"/>
            <g transform="translate(200 18)" fill="#A99DE6">
                <path d="M30 0 60 12 30 24 0 12Z"/>
                <path d="M12 17v13c0 4 8 8 18 8s18-4 18-8V17L30 25Z" opacity="0.85"/>
                <path d="M56 13v14" stroke="#A99DE6" stroke-width="2"/>
            </g>
        </svg>
        <nav class="contenedor pestanas" aria-label="Secciones">
            <a href="{% url 'inicio' %}" class="pestana{% if pestana == 'camara' %} activa{% endif %}">
                <svg class="icono"><use href="#i-camara"/></svg>Cámara
            </a>
            <a href="{% url 'horarios' %}" class="pestana{% if pestana == 'horarios' %} activa{% endif %}">
                <svg class="icono"><use href="#i-reloj"/></svg>Horarios
            </a>
            <a href="{% url 'lista_asistencias' %}" class="pestana{% if pestana == 'historial' %} activa{% endif %}">
                <svg class="icono"><use href="#i-historial"/></svg>Historial
            </a>
        </nav>
    </header>

    {% block contenido %}{% endblock %}

    {% block scripts %}{% endblock %}

</body>
</html>
